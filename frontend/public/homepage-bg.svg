      <stop offset="1" stop-color="#fbf6f1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7e6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff7e6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1536" height="1024" fill="url(#wall)"/>
  <rect y="690" width="1536" height="334" fill="url(#floor)"/>

