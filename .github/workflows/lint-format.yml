name: Lint & Format

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Prettier check
        run: npm run format:check
